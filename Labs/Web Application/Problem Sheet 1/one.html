<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personal Details</title>
  <style>
    body {
      margin: 20px;
      font-family: Arial, sans-serif;
      position: relative;
      min-height: 100vh;
      background: #fff;
    }

    /* Heading style */
    h1 {
      font-family: "Times New Roman", serif;
      font-size: 24px;
      margin-bottom: 30px;
      text-align: center;
    }

    /* Background logo in top right */
    body::before {
      content: "";
      position: fixed;
      top: 10px;
      right: 10px;
      width: 120px;
      height: 120px;
      background-repeat: no-repeat;
      background-size: contain;
      background-position: top right;
      opacity: 0.15; /* subtle */
      pointer-events: none;
      z-index: 1000;
      align-items: center;
    }

    table{
        display: flex;
        align-items: center;
        justify-content: center;
        
    }

    td {
      border: 1px solid #ccc;
      padding: 12px 15px;
      vertical-align: middle;
    }
    nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background-color: transparent;
    padding: 10px 20px;
  }

  /* Logo */
  .logo img {
    height: 50px;
  }

  /* Nav menu */
  .nav-menu {
    list-style: none;
    display: flex;
    margin: 0;
    padding: 0;
  }

  .nav-menu li {
    margin-left: 25px;
    color: black;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.3s ease, color 0.3s ease;
    padding: 8px 12px;
    border-radius: 4px;
  }

  .nav-menu li:hover {
    background-color: #005f99;
  }
  </style>
</head>
<body>
    <nav>
        <div class="logo">
          <img src="https://upload.wikimedia.org/wikipedia/en/e/eb/PSG_College_of_Technology_logo.png" alt="College Logo" />
        </div>
      
        <ul class="nav-menu">
          <li>Home</li>
          <li>About</li>
          <li>Gallery</li>
          <li>Academics</li>
        </ul>
      </nav>
  <h1>Personal Details</h1>
  <table>
    <tr>
      <td class="label">Name:</td>
      <td class="value">Tino Britty J</td>
    </tr>
    <tr>
      <td class="label">Class:</td>
      <td class="value">Master's in Computer Applications</td>
    </tr>
    <tr>
      <td class="label">Qualifications:</td>
      <td class="value">UG</td>
    </tr>
    <tr>
      <td class="label photo">Photo:</td>
      <td class="value photo">
        <img src="https://media.licdn.com/dms/image/v2/D4E03AQHQ16Zff0PVhw/profile-displayphoto-scale_200_200/B4EZerUEUAHcAY-/0/1750925858066?e=2147483647&v=beta&t=n9Uq0s13tYnIofZMyPn-fI7n6Ls572UlbNga0Rk8gFk" alt="Profile Photo" />
      </td>
    </tr>
    <tr>
      <td class="label">Address:</td>
      <td class="value">
        123, Abc Street,
        Coimbatore,
        India - 641027
      </td>
    </tr>
  </table>
</body>
</html>
