<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>File Handling App</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">File Handling App</h1>

    <!-- Employee Login -->
    <h3>Employee Login</h3>
    <input id="empID" class="form-control mb-2" placeholder="EmpID">
    <input id="empDate" class="form-control mb-2" type="date">
    <input id="empTimeIn" class="form-control mb-2" type="time">
    <input id="empTimeOut" class="form-control mb-2" type="time">
    <button class="btn btn-primary mb-3" onclick="addEmployee()">Add Employee</button>
    <input id="checkDate" class="form-control mb-2" type="date" placeholder="Check employees after 10AM">
    <button class="btn btn-info mb-3" onclick="countEmployee()">Check Count</button>
    <div id="empCount"></div>

    <hr>

    <!-- Products -->
    <h3>Products</h3>
    <input id="prodID" class="form-control mb-2" placeholder="Product ID">
    <input id="prodDesc" class="form-control mb-2" placeholder="Description">
    <input id="prodPrice" class="form-control mb-2" type="number" placeholder="Price">
    <input id="prodStock" class="form-control mb-2" type="number" placeholder="Stock">
    <button class="btn btn-success mb-3" onclick="addProduct()">Add Product</button>
    <button class="btn btn-warning mb-3" onclick="getLowStock()">Show Low Stock</button>
    <div id="lowStockList"></div>

    <hr>

    <!-- Orders -->
    <h3>Food Orders</h3>
    <input id="orderID" class="form-control mb-2" placeholder="Order ID">
    <input id="itemName" class="form-control mb-2" placeholder="Item Name">
    <input id="itemPrice" class="form-control mb-2" type="number" placeholder="Price">
    <input id="itemQty" class="form-control mb-2" type="number" placeholder="Quantity">
    <button class="btn btn-warning mb-3" onclick="addOrder()">Add Order</button>
    <button class="btn btn-info mb-3" onclick="showTotalSales()">Total Sales</button>
    <div id="totalSales"></div>

</div>
<script src="js/script.js"></script>
</body>
</html>
