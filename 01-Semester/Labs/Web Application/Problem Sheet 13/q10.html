<!doctype html>
<html>
<head><meta charset="utf-8"><title>Q10</title></head>
<body>
  <div id="count">10</div>

  <script>
    let t = 10;
    const el = document.getElementById('count');
    el.textContent = t;

    const id = setInterval(() => {
      t--;
      if (t <= 0) {
        el.textContent = "Time's up!";
        clearInterval(id);
      } else {
        el.textContent = t;
      }
    }, 1000);
  </script>
</body>
</html>
