<!DOCTYPE html>
<html>
<head>
  <title>Simple Invoice Calculator</title>
</head>
<body>

<h2>Invoice Calculator</h2>

<label>Item Name:</label>
<input type="text" id="itemName"><br><br>

<label>Price:</label>
<input type="number" id="price"><br><br>

<label>Quantity:</label>
<input type="number" id="qty"><br><br>

<button onclick="calculateInvoice()">Add Item</button>

<h3>Invoice:</h3>
<div id="invoice"></div>
<h3 id="grandTotal">Total: 0</h3>

<script>
let totalAmount = 0;

function calculateInvoice() {
    let item = document.getElementById("itemName").value;
    let price = parseFloat(document.getElementById("price").value);
    let qty = parseInt(document.getElementById("qty").value);

    if(item === "" || isNaN(price) || isNaN(qty)) {
        alert("Please enter valid details!");
        return;
    }

    let total = price * qty;
    totalAmount += total;

    // Display invoice item
    let invoiceDiv = document.getElementById("invoice");
    invoiceDiv.innerHTML += item + " - " + qty + " x " + price + " = " + total + "<br>";

    // Display grand total
    document.getElementById("grandTotal").innerHTML = "Total: " + totalAmount;

    // Clear inputs
    document.getElementById("itemName").value = "";
    document.getElementById("price").value = "";
    document.getElementById("qty").value = "";
}
</script>

</body>
</html>
