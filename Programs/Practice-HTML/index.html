<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Student Registration Form</h1>
    <form class="form1">
        <label>Full Name : <input type="text" required></label>
        <label>Email ID: <input type="email" required></label>
        <label>Gender</label>
        <input type="radio"><label>Male</label>
        <input type="radio"><label>Female</label>
        <input type="radio"><label>Other</label>
        <label for="course">Choose a Course</label>
        <select > <!--id="course" name="fruits"-->
            <option value="MCA">MCA</option>
            <option value="MSC">MSC</option>
            <option value="ME">ME</option>
        </select>
        <label>Hobies</label>
        <label><input type="checkbox">Reading</label>
        <label><input type="checkbox">Sports</label>
        <label><input type="checkbox">Music</label>
        <label><input type="checkbox">Others</label>
    <button>Submit</button>
    </form>
</body>

</html>
