<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
        <th>ItemName</th>
        <th>Quantity</th>
        <th>Price per kg</th>
        <th>Total price(RS.)</th>
        <tr>
            <td>Apple</td>
            <td>2</td>
            <td>160.00</td>
            <td>320.00</td>
        </tr>
        <tr>
            <td>Orange</td>
            <td>3</td>
            <td>260.00</td>
            <td>120.00</td>
        </tr>
        <tr>
            <td>Total</td>
            <td>5</td>
            <td>460.00</td>
            <td>520.00</td>
        </tr>
    </table>
</body>
<style>
tr {
  background-color: #f2f2f2; /* Zebra striping */
}
tr:hover {
  background-color: #ddd; /* Hover effect */
}
tr:last-child {
  background-color: orange; /* Total row style */
}

</style>
</html>
