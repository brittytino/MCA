<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Template</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            box-sizing: border-box;
        }
        section {
            display: -webkit-flex;
            display: flex;
        }
        nav {
            -webkit-flex: 1;
            -ms-flex: 1;
            flex: 1;
            background: #ccc;
            padding: 20px;
        }
        nav ul {
            list-style-type: none;
            padding: 0;
        }
        article {
            -webkit-flex: 3;
            -ms-flex: 3;
            flex: 3;
            background-color: orange;
            padding: 10px;
        }
        footer {
            background-color: red;
            padding: 10px;
            text-align: center;
            color: white;
        }
        @media (max-width: 600px) {
            section {
                -webkit-flex-direction: column;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <h2>Semester Examination</h2>
    <p>It is our Web Tech Examination.</p>

    <header>
        <h2>In Cities</h2>
    </header>

    <section>
        <nav>
            <ul>
                <li><a href="https://en.wikipedia.org/wiki/London">London</a></li>
                <li><a href="https://en.wikipedia.org/wiki/Paris">Paris</a></li>
                <li><a href="https://en.wikipedia.org/wiki/Tokyo">Tokyo</a></li>
            </ul>
        </nav>

        <article>
            <h1>London</h1>
            <p>Web Technology is a course offered for all IT students.</p>
            <p>Examination for this course is conducted in different cities.</p>
        </article>
    </section>

    <footer>
        <p>May 2024</p>
    </footer>
</body>
</html>
