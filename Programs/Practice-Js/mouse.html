<!DOCTYPE html>
<html>
<head>
    <title>Event Handling Example</title>
</head>
<body>

    <h2>JavaScript Event Handling Example</h2>

    <!-- Input field that turns yellow when focused -->
    <p>Type something below:</p>
    <input type="text" onfocus="this.style.background='yellow'" placeholder="Click here to focus">

    <br><br>

    <!-- Image that grows on hover -->
    <p>Hover over the image:</p>
    <img src="https://m.media-amazon.com/images/M/MV5BYWVjODZjNDgtYjk4ZS00OTg5LTg5NDQtZDMxZDQ4ZmM5MGJmXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" 
         width="32" height="32"
         onmouseover="this.style.width='64px'; this.style.height='64px';" 
         onmouseout="this.style.width='32px'; this.style.height='32px';" 
         alt="Smiley Image">

</body>
</html>
