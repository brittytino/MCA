<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Data</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 10px;
      text-align: center;
    }

    h1 {
      color: blue;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Data below</h1>
    <p id="showName"></p>
    <p id="showRollno"></p>
  </div>

  <script>
    // Fetch from localStorage
    document.getElementById("showName").textContent = "Name: " + localStorage.getItem("name");
    document.getElementById("showRollno").textContent = "Roll No: " + localStorage.getItem("rollno");
  </script>
</body>
</html>
